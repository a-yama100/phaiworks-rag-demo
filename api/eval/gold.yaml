    expect: Lipoprotein(a)
    tag: exact
  - id: exact-08
    question: NT-proBNP
    expect: NT-proBNP
    tag: exact
  - id: exact-09
    question: hs-CRP
    expect: hs-CRP
    tag: exact
  - id: exact-10

  # --- confusable clusters ----------------------------------------------------
  # Every one of these has at least two briefs that a plain semantic search will
  # happily return. Getting the right one is the whole job.
  - id: conf-01
    question: which cholesterol number is the protective one
    expect: HDL Cholesterol
    tag: confusable
  - id: conf-02
    question: the cholesterol measure that does not need me to fast
    expect: Non-HDL Cholesterol
    tag: confusable
  - id: conf-03
    question: the blood fat that goes up after alcohol and sugary food
    expect: Triglycerides
    tag: confusable
  - id: conf-04
    question: the inherited cholesterol particle that statins do not shift
    expect: Lipoprotein(a)
    tag: confusable
  - id: conf-05
    question: which liver enzyme tells me whether a high ALP is bone or liver
    expect: GGT
    tag: confusable
  - id: conf-06
    question: the liver enzyme that is also released by muscle
    expect: AST
    tag: confusable
  - id: conf-07

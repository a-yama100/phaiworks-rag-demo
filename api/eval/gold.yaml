    tag: confusable
  - id: conf-10
    question: the iron test that is not thrown off by inflammation
    expect: Transferrin Saturation
    tag: confusable
  - id: conf-11
    question: the iron measurement that swings through the day and means little alone
    expect: Serum Iron
    tag: confusable
  - id: conf-12

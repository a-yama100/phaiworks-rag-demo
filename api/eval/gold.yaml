# Gold set for retrieval evaluation.
#
# Each case is a question plus the brief that should come back. Cases are tagged by the
# kind of retrieval failure they are designed to catch, so a regression tells you which
# part of the pipeline broke rather than just that the score dropped:
#
#   lay        - user describes a symptom, never names the marker (dense should win)
#   exact      - user types the marker name or abbreviation (BM25 should win)
#   confusable - several briefs are plausible; only one is right (this is the hard set)
#   oos        - out of scope; the correct behaviour is to refuse
#
# `expect: null` means the pipeline must NOT confidently answer. Those cases are scored
# on refusal, not on retrieval — a system that answers everything scores 100% on the
# other cases and is still unusable.

cases:
  # --- lay wording, no marker named ------------------------------------------
  - id: lay-01
    question: my blood sugar average over the last few months
    expect: HbA1c
    tag: lay
  - id: lay-02
    question: am I prediabetic
    expect: HbA1c
    tag: lay
  - id: lay-03
    question: I feel exhausted all the time and think my iron is low
    expect: Ferritin
    tag: lay
  - id: lay-04
    question: bad cholesterol and heart attack risk
    expect: LDL Cholesterol
    tag: lay
  - id: lay-05
    question: is my thyroid underactive
    expect: TSH
    tag: lay
  - id: lay-06
    question: low vitamin from not getting enough sunlight
    expect: Vitamin D
    tag: lay
  - id: lay-07
    question: pins and needles in my hands and a sore tongue
    expect: Vitamin B12
    tag: lay
  - id: lay-08
    question: I bruise very easily and my gums bleed
    expect: Platelets
    tag: lay
  - id: lay-09
    question: sudden agonising pain in my big toe
    expect: Uric Acid
    tag: lay
  - id: lay-10
    question: breathless when I lie flat and my ankles are swollen
    expect: NT-proBNP
    tag: lay
  - id: lay-11
    question: yellow eyes and dark urine
    expect: Bilirubin
    tag: lay
  - id: lay-12
    question: muscle aches since starting my cholesterol tablets
    expect: Creatine Kinase
    tag: lay
  - id: lay-13
    question: how much oxygen my blood can carry
    expect: Haemoglobin
    tag: lay
  - id: lay-14
    question: cramps and twitching that will not settle
    expect: Magnesium
    tag: lay
  - id: lay-15
    question: milk coming from my breasts but I am not pregnant
    expect: Prolactin
    tag: lay
  - id: lay-16
    question: my periods have stopped and I get hot flushes
    expect: Oestradiol
    tag: lay

  # --- exact names and abbreviations ------------------------------------------
  - id: exact-01
